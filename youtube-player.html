<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soundversation Player</title>
  <style>
    html, body, iframe { height:100%; margin:0; width:100%; }
    body { background:#000; overflow:hidden; }
    iframe { border:0; display:block; }
  </style>
</head>
<body>
  <script>
    const allowedVideos = new Set(['AxBFLMr0cEo', 'VFiGrJuEICw']);
    const videoId = new URLSearchParams(window.location.search).get('video');
    if (allowedVideos.has(videoId)) {
      const player = document.createElement('iframe');
      player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&playsinline=1`;
      player.title = 'Soundversation video';
      player.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      player.allowFullscreen = true;
      document.body.appendChild(player);
    }
  </script>
</body>
</html>
